# qBittorrent: torrent client with a web UI, reachable only over the tailnet.
# Downloads land in /srv/homelab/media/downloads, which Jellyfin already sees (read-only),
# so finished files show up in its library. Config is a small PVC on the SSD.
# No inbound peer port is exposed: it still downloads, just with fewer peers.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: qbittorrent-config, namespace: qbittorrent}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: qbittorrent, namespace: qbittorrent}
spec:
  replicas: 1
  strategy: {type: Recreate}   # one writer for the config volume
  selector: {matchLabels: {app: qbittorrent}}
  template:
    metadata: {labels: {app: qbittorrent}}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      containers:
        - name: qbittorrent
          image: qbittorrentofficial/qbittorrent-nox:5.3.0-2
          env:
            - {name: QBT_LEGAL_NOTICE, value: confirm}
            - {name: QBT_WEBUI_PORT, value: "8081"}
          ports: [{containerPort: 8081}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: downloads, mountPath: /downloads}
          readinessProbe: {tcpSocket: {port: 8081}, periodSeconds: 10}
      volumes:
        - name: config
          persistentVolumeClaim: {claimName: qbittorrent-config}
        - name: downloads
          hostPath: {path: /srv/homelab/media/downloads, type: DirectoryOrCreate}
---
# Entry point for `tailscale serve --bg --tcp 8081 tcp://127.0.0.1:30081`. The app listens on 8081 too:
# qBittorrent rejects requests whose Host port differs from its own, so the ports must match.
apiVersion: v1
kind: Service
metadata: {name: qbittorrent-nodeport, namespace: qbittorrent}
spec:
  type: NodePort
  selector: {app: qbittorrent}
  ports:
    - {port: 8081, targetPort: 8081, nodePort: 30081}
