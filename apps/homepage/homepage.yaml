# Homepage (gethomepage.dev): one page with links to every app.
# Public config lives here. The link list (it contains the Tailscale address)
# is a SOPS secret, `homepage-private`, created by install.sh.
apiVersion: v1
kind: ConfigMap
metadata: {name: homepage-config, namespace: homepage}
data:
  settings.yaml: |
    title: HomeLab
    headerStyle: clean
    theme: dark
    color: slate
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: homepage, namespace: homepage}
spec:
  replicas: 1
  selector: {matchLabels: {app: homepage}}
  template:
    metadata: {labels: {app: homepage}}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false   # no Kubernetes integration, so no API token needed
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.7.0
          ports: [{containerPort: 3000}]
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS    # Host headers accepted; set from the secret
              valueFrom: {secretKeyRef: {name: homepage-private, key: allowed-hosts}}
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /app/config/settings.yaml, subPath: settings.yaml}
            - {name: private, mountPath: /app/config/services.yaml, subPath: services.yaml}
      volumes:
        - name: config
          configMap: {name: homepage-config}
        - name: private
          secret: {secretName: homepage-private}
---
# Entry point for `tailscale serve --bg --tcp 80 tcp://127.0.0.1:30800`.
apiVersion: v1
kind: Service
metadata: {name: homepage-nodeport, namespace: homepage}
spec:
  type: NodePort
  selector: {app: homepage}
  ports:
    - {port: 3000, targetPort: 3000, nodePort: 30800}
