# Nextcloud: file sync and sharing. Own Postgres, no Redis (single user; DB locking is enough).
# Layout (apps and databases on the SSD, bulk data on the big drive):
#   nextcloud-html PVC  (SSD)  app code + config.php
#   nextcloud-postgres PVC (SSD) database
#   /srv/homelab/files  (hostPath) user files; on a new PC mount the big drive here
# Private values (passwords, tailnet name) live in the SOPS secret `nextcloud-private`.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: nextcloud-html, namespace: nextcloud}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 3Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: nextcloud-postgres, namespace: nextcloud}
spec:
  selector: {app: nextcloud-postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: nextcloud-postgres, namespace: nextcloud}
spec:
  serviceName: nextcloud-postgres
  replicas: 1
  selector: {matchLabels: {app: nextcloud-postgres}}
  template:
    metadata: {labels: {app: nextcloud-postgres}}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext: {runAsUser: 70, runAsGroup: 70, fsGroup: 70}   # postgres user in the alpine image
      containers:
        - name: postgres
          image: postgres:16.15-alpine
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: nextcloud}
            - {name: POSTGRES_USER, value: nextcloud}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: nextcloud-private, key: db-password}}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          readinessProbe: {exec: {command: [pg_isready, -U, nextcloud]}, periodSeconds: 10}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: nextcloud, namespace: nextcloud}
spec:
  replicas: 1
  strategy: {type: Recreate}   # one RWO volume, never two pods at once
  selector: {matchLabels: {app: nextcloud}}
  template:
    metadata: {labels: {app: nextcloud}}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: nextcloud
          image: nextcloud:34.0.5-apache
          ports: [{containerPort: 80}]
          env:
            - {name: POSTGRES_HOST, value: nextcloud-postgres}
            - {name: POSTGRES_DB, value: nextcloud}
            - {name: POSTGRES_USER, value: nextcloud}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: nextcloud-private, key: db-password}}}
            - {name: NEXTCLOUD_ADMIN_USER, valueFrom: {secretKeyRef: {name: nextcloud-private, key: admin-user}}}
            - {name: NEXTCLOUD_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: nextcloud-private, key: admin-password}}}
            - {name: NEXTCLOUD_DATA_DIR, value: /data}
            # Reached through `tailscale serve` (HTTPS, port 8443): trust that name and the proxy hop.
            - {name: NEXTCLOUD_TRUSTED_DOMAINS, valueFrom: {secretKeyRef: {name: nextcloud-private, key: host}}}
            - {name: OVERWRITEHOST, valueFrom: {secretKeyRef: {name: nextcloud-private, key: host-port}}}
            - {name: OVERWRITEPROTOCOL, value: https}
            - {name: TRUSTED_PROXIES, value: 10.42.0.1}   # the node gateway: all traffic arrives from it
            - {name: PHP_MEMORY_LIMIT, value: 512M}
            - {name: PHP_UPLOAD_LIMIT, value: 16G}
          # The image starts as root to prepare files, then Apache drops to www-data.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER, NET_BIND_SERVICE]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          startupProbe: {tcpSocket: {port: 80}, periodSeconds: 10, failureThreshold: 60}   # first install takes minutes
          livenessProbe: {tcpSocket: {port: 80}, periodSeconds: 30, failureThreshold: 5}
          volumeMounts:
            - {name: html, mountPath: /var/www/html}
            - {name: files, mountPath: /data}
        # Background jobs (file scans, cleanup). Same image, same volumes.
        - name: cron
          image: nextcloud:34.0.5-apache
          command: [/cron.sh]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: html, mountPath: /var/www/html}
            - {name: files, mountPath: /data}
      volumes:
        - name: html
          persistentVolumeClaim: {claimName: nextcloud-html}
        - name: files
          hostPath: {path: /srv/homelab/files, type: Directory}
---
# Entry point for `tailscale serve --bg --https=8443 http://127.0.0.1:30443`.
apiVersion: v1
kind: Service
metadata: {name: nextcloud-nodeport, namespace: nextcloud}
spec:
  type: NodePort
  selector: {app: nextcloud}
  ports: [{port: 80, targetPort: 80, nodePort: 30443}]
