# Jellyfin: media server (CPU transcoding only; GPU is a later, per-machine step).
# Media is read from the host folder /srv/homelab/media. On a new machine, mount the big
# drive there (fstab) and nothing else changes. Config/database is a 5Gi PVC on the SSD.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: jellyfin-config, namespace: jellyfin}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: jellyfin, namespace: jellyfin}
spec:
  replicas: 1
  strategy: {type: Recreate}   # SQLite + RWO volume: never two pods at once
  selector: {matchLabels: {app: jellyfin}}
  template:
    metadata: {labels: {app: jellyfin}}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:12.4
          ports: [{containerPort: 8096}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 2Gi}   # library scans and transcodes are the peaks
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: cache, mountPath: /cache}
            - {name: media, mountPath: /media, readOnly: true}   # Jellyfin never writes to your media
          readinessProbe: {httpGet: {path: /health, port: 8096}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: 8096}, periodSeconds: 30, failureThreshold: 5}
      volumes:
        - name: config
          persistentVolumeClaim: {claimName: jellyfin-config}
        - name: cache
          emptyDir: {sizeLimit: 5Gi}   # transcode temp files; lost on restart, which is fine
        - name: media
          hostPath: {path: /srv/homelab/media, type: Directory}
---
# Entry point for `tailscale serve --bg --tcp 8096 tcp://127.0.0.1:30096`.
apiVersion: v1
kind: Service
metadata: {name: jellyfin-nodeport, namespace: jellyfin}
spec:
  type: NodePort
  selector: {app: jellyfin}
  ports:
    - {port: 8096, targetPort: 8096, nodePort: 30096}
