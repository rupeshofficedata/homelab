# Entry point for `tailscale serve --bg --tcp 9090 tcp://127.0.0.1:30900`.
# Loopback-only NodePort, same pattern as grafana-nodeport.yaml. Prometheus has
# no login, so it must stay tailnet-only.
apiVersion: v1
kind: Service
metadata:
  name: prometheus-nodeport
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
    prometheus: monitoring-kube-prometheus-prometheus
  ports:
    - {port: 9090, targetPort: 9090, nodePort: 30900}
