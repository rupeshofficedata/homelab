# Prometheus + Grafana (kube-prometheus-stack) + our alert rules and Grafana entry point.
# ServerSideApply is required: the chart's CRDs are too large for client-side apply.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  destination: {server: https://kubernetes.default.svc, namespace: monitoring}
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.11.0
      helm:
        releaseName: monitoring
        valueFiles: [$values/platform/monitoring/values.yaml]
    - repoURL: https://github.com/rupeshofficedata/homelab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/rupeshofficedata/homelab.git
      targetRevision: main
      path: platform/monitoring
      directory: {include: "{rules,grafana-nodeport,prometheus-nodeport}.yaml"}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
