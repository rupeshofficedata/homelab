# App-of-apps root: watches argocd/apps/ and creates one Application per file.
# Adding an app = adding a file there and merging to main.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  destination: {server: https://kubernetes.default.svc, namespace: argocd}
  source:
    repoURL: https://github.com/rupeshofficedata/homelab.git
    targetRevision: main
    path: argocd/apps
  syncPolicy:
    automated: {prune: true, selfHeal: true}
