# The "core" install has no API server, and the API server is what normally
# creates the `default` project. Without it every Application is rejected
# ("project default which does not exist"). Single-user cluster, so allow all.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
spec:
  sourceRepos: ["*"]
  destinations:
    - namespace: "*"
      server: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
